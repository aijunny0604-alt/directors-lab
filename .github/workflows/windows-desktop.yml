name: Windows 로컬 앱 빌드
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - desktop-app/**
      - .github/workflows/windows-desktop.yml
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Directors-Lab-Windows
          path: |
            desktop-app/dist/*.exe
            desktop-app/dist/*.zip
            desktop-app/README-KO.txt
          retention-days: 30
      - name: GitHub Releases에 설치 파일 게시
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $directorVersion = node -p "require('./package.json').version"
          $directorTag = "desktop-v$directorVersion-build$env:GITHUB_RUN_NUMBER"
          $directorAssets = Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object FullName
          gh release create $directorTag @directorAssets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Windows 로컬 앱 $directorVersion" --notes-file README-KO.txt --latest
