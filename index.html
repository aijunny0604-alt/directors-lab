function nav(){let el=document.querySelector('#nav');let old=el.scrollLeft;el.innerHTML=NAV_GROUPS.map(([group,items])=>`<div class="navgroup">${group}</div>`+items.map(t=>`<button class="${page===t?'active':''}" data-page="${t}" ${page===t?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${NAV_PATHS[t]}</svg>${t}</button>`).join('')).join('');el.scrollLeft=old;document.querySelector('#currentPage').textContent=page;el.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>open(b.dataset.page));let active=el.querySelector('.active');if(active&&innerWidth<=900){let r=active.getBoundingClientRect(),nr=el.getBoundingClientRect();if(r.left<nr.left||r.right>nr.right)el.scrollLeft+=r.left-nr.left-12}}
function open(t){page=t;render();window.scrollTo({top:0,behavior:"instant"})}
function progress(){return Object.values(S.done).filter(Boolean).length}
function render(){nav();view.className=page==='제작 보드'?'production':'';if(page==="홈")home();if(page==="교재")learn();if(page==="분석·기획")form();if(page==="기록 보관함")archive();if(page==="체크리스트")check();if(page==="AI 코칭")coach();if(page==="백업")backup();if(page==="연출 사전")dictionary();if(page==="STC 작법")stc();if(page==="광고 스튜디오")adstudio();if(page==="제작 보드")production();if(["STC 작법","광고 스튜디오","제작 보드"].includes(page))addJumps()}
function addJumps(){const config={"STC 작법":[["스토리 유형","v2grid"],["로그라인·인물","storyReview"],["15비트","v2board"]],"광고 스튜디오":[["광고 사례","v2grid"],["제작 레시피","data-format"],["브리프","adReview"],["체크리스트","adProgress"]],"제작 보드":[["기획·분석 연결","fromBeats"],["시나리오 보드","v2board"],["샷 리스트","targetSec"],["프롬프트·내보내기","allPrompt"]]};const bar=document.createElement('div');bar.className='jumpbar';bar.setAttribute('aria-label','단계별 이동');config[page].forEach(([label,key])=>{let b=document.createElement('button');b.textContent=label;b.type='button';b.onclick=()=>{let e=document.getElementById(key)||view.querySelector('.'+key)||view.querySelector('['+key+']');if(!e)return;let anchor=e.matches('.v2grid,.v2board')?e:e.closest('.card')||e; if(key==='data-format')anchor=e.closest('.v2grid')||anchor;if(key==='storyReview'||key==='adReview'||key==='adProgress'||key==='targetSec'||key==='allPrompt')anchor=e.closest('.card')||e;anchor.scrollIntoView({block:'start',behavior:'smooth'})};bar.append(b)});let project=view.querySelector('.project-card');if(project)project.after(bar);else view.prepend(bar)}
function home(){const p=progress();const next=D.lessons.find(l=>!S.done[l.id]);let count=Object.keys(S.v2?.projects||{}).length;const stages=[['01 / LEARN','전문 연출 사전','123개 용어 · 도식 · 영화 연구','연출 사전'],['02 / OBSERVE','작품 분석','5분 감상 · 20분 장면 연구','분석·기획'],['03 / WRITE','스토리 설계','Save the Cat! · 10가지 유형 · 15비트','STC 작법'],['04 / COMMERCIAL','광고 스튜디오','8개 사례 · 10종 레시피 · 검수','광고 스튜디오'],['05 / PRODUCE','제작 보드','씬 · 숏 · 콘티 · 프롬프트','제작 보드'],['06 / REVIEW','AI 감독 코칭','근거 중심 피드백 · 수정 실습','AI 코칭']];view.innerHTML=`<div class="dashhero"><div class="hero-content"><div class="tag">PERSONAL CREATIVE WORKSPACE / 02.1</div><h2>관찰에서 작품으로.<br>나만의 연출 언어를.</h2><p>48강의 실전 교재, 전문 연출 사전과 스토리·광고 제작을 하나의 작업실에서 연결하세요.</p><div class="actions"><button class="primary" id="goLearn">오늘의 수업 시작</button><button id="goWrite">새 작품 분석</button></div></div></div><div class="grid"><div class="card"><small>완료 수업</small><div class="metric">${p}<span style="font-size:15px;color:var(--muted)"> / 48</span></div><div class="bar"><i style="width:${p/48*100}%"></i></div></div><div class="card"><small>분석·창작 기록</small><div class="metric">${S.records.length}</div><small>나의 아카이브</small></div><div class="card"><small>제작 프로젝트</small><div class="metric">${count}</div><small>스토리 · 광고 · 콘티</small></div></div><div class="dash-head"><h3>창작 워크플로</h3><small>6 MODULES</small></div><div class="workgrid">${stages.map(a=>`<button class="worktile" data-dash="${a[3]}"><span class="work-index">${a[0]}</span><b>${a[1]}</b><span>${a[2]}</span></button>`).join('')}</div><div class="home-bottom"><div class="card"><div class="tag">NEXT LESSON</div><h3 style="font-size:20px;margin-top:8px">${next?E(next.id+' · '+next.title):'48강 완료!'}</h3><p class="muted">${next?E(next.task):'완성작 검토와 재실험을 반복하세요.'}</p><button id="goNext">교재 보기</button></div><div class="card"><div class="tag">DAILY PRACTICE</div><h3 style="font-size:20px;margin-top:8px">하루 50분 성장 루틴</h3><p>10분 이론 · 15분 관찰 · 20분 창작 · 5분 회고</p><small>관찰 사실, 해석과 의도 가설을 구분하고 증거를 남기세요. 중요한 기록은 JSON 백업으로 보관합니다.</small></div></div>`;document.querySelector('#goLearn').onclick=()=>open('교재');document.querySelector('#goNext').onclick=()=>open('교재');document.querySelector('#goWrite').onclick=()=>open('분석·기획');view.querySelectorAll('[data-dash]').forEach(b=>b.onclick=()=>open(b.dataset.dash))}
function learn(){view.innerHTML=`<h2>48강 마스터 교재</h2><p class="muted">각 강의의 원리 → 작품 예시 → 실습 → 통과 기준. 완료 여부와 개인 메모를 기록하세요.</p><input id="searchLesson" placeholder="수업명·분야·작품 검색" value="${E(filter)}"><div id="lessons"></div>`;const draw=()=>{document.querySelector("#lessons").innerHTML=D.lessons.filter(l=>Object.values(l).join(" ").toLowerCase().includes(filter.toLowerCase())).map(l=>`<details class="card"><summary><span class="tag">${E(l.id)} / WEEK ${l.week}</span>　${E(l.title)} ${S.done[l.id]?"✓":""}</summary><p class="muted">${E(l.area)}</p><h3>핵심 원리</h3><p>${E(l.principle)}</p><h3>작품 분석 대상</h3><p>${E(l.reference)}</p><h3>실습</h3><p>${E(l.task)}</p><h3>통과 기준</h3><p>${E(l.criteria)}</p><label for="n${l.id}">내 메모</label><textarea id="n${l.id}" data-note="${l.id}">${E(S.notes[l.id]||"")}</textarea><div class="check"><input type="checkbox" id="d${l.id}" data-done="${l.id}" ${S.done[l.id]?"checked":""}><label for="d${l.id}">실습 및 기준 확인 완료</label></div><button data-practice="${l.id}">이 수업의 실습 기록 작성</button></details>`).join("");document.querySelectorAll("[data-note]").forEach(x=>x.oninput=()=>{S.notes[x.dataset.note]=x.value;save()});document.querySelectorAll("[data-done]").forEach(x=>x.onchange=()=>{S.done[x.dataset.done]=x.checked;save();notify("학습 상태 저장")});document.querySelectorAll("[data-practice]").forEach(x=>x.onclick=()=>{selected="실습 기록";editing=null;S.drafts[selected]={"수업 ID":x.dataset.practice,"날짜":now()};open("분석·기획")})};document.querySelector("#searchLesson").oninput=e=>{filter=e.target.value;draw()};draw()}
function form(){const f=D.fields[selected];const draft=editing?S.records.find(x=>x.id===editing)?.values||{}:S.drafts[selected]||{};view.innerHTML=`<h2>분석 및 창작 기록</h2><p class="muted">예시는 가상의 단편 「마지막 신호」를 활용한 교육용 기록입니다. 작성 예시 보기를 눌러 참고하고 내 관찰을 적으세요. <a href="https://savethecat.com/beat-mapper" target="_blank" rel="noopener">Save the Cat 공식 비트 안내</a> · <a href="https://aijunny0604-alt.github.io/video-prompt-composer/" target="_blank" rel="noopener">영상 프롬프트 조합기</a></p><select id="kind">${Object.keys(D.fields).map(k=>`<option ${k===selected?"selected":""}>${E(k)}</option>`).join("")}</select><div class="card">${selected==="Save the Cat 15비트"?`<p class="muted">${E(STC_NOTE)}</p>`:""}<p class="muted">${editing?"기존 기록 수정 중":"새 기록 작성 · 입력 중 브라우저에 임시 저장 (예시는 자동 입력되지 않음)"}</p><form id="entry">${f.map(([a,b],i)=>`<label for="f${i}">${E(a)}</label><small>${E(b)}</small>${EXAMPLES[selected]?.[a]?`<details class="example"><summary>작성 예시 보기</summary><p>${E(EXAMPLES[selected][a])}</p></details>`:""}${guidedChoices[selected]?.[a]?`<select id="f${i}" data-key="${E(a)}"><option value="">선택 안 함</option>${guidedChoices[selected][a].map(x=>`<option value="${E(x)}" ${draft[a]===x?"selected":""}>${E(x)}</option>`).join("")}</select>`:a.includes("상태")?`<select id="f${i}" data-key="${E(a)}">${["미요청","요청","검토완료","재검토"].map(x=>`<option ${draft[a]===x?"selected":""}>${x}</option>`).join("")}</select>`:a==="날짜"||a==="기록일"||a==="감상일"?`<input type="date" id="f${i}" data-key="${E(a)}" value="${E(draft[a]||now())}">`:i===0?`<input id="f${i}" data-key="${E(a)}" value="${E(draft[a]||"")}" required placeholder="${E(b)}">`:`<textarea id="f${i}" data-key="${E(a)}" placeholder="${E(b)}">${E(draft[a]||"")}</textarea>`}`).join("")}<div class="actions"><button class="primary" type="submit">기록 저장</button><button type="button" id="copyDraft">AI 검토용 복사</button><button type="button" id="cancelEdit">새 기록 / 취소</button></div></form></div>`;document.querySelector("#kind").onchange=e=>{selected=e.target.value;editing=null;form()};const values=()=>Object.fromEntries([...document.querySelectorAll("[data-key]")].map(x=>[x.dataset.key,x.value]));document.querySelector("#entry").oninput=()=>{if(!editing){S.drafts[selected]=values();save()}};document.querySelector("#entry").onsubmit=e=>{e.preventDefault();const v=values();if(editing){let r=S.records.find(x=>x.id===editing);r.values=v;r.updated=new Date().toISOString()}else S.records.unshift({id:Date.now()+"-"+Math.random().toString(36).slice(2,7),type:selected,values:v,updated:new Date().toISOString()});delete S.drafts[selected];editing=null;save();notify("기록 저장 완료");open("기록 보관함")};document.querySelector("#copyDraft").onclick=()=>copyReview({type:selected,values:values()});document.querySelector("#cancelEdit").onclick=()=>{editing=null;delete S.drafts[selected];save();form()}}
function archive(){view.innerHTML=`<h2>기록 보관함</h2><input id="recordSearch" placeholder="작품명·프로젝트·내용 검색"><div id="records"></div>`;function draw(q=""){let rs=S.records.filter(r=>JSON.stringify(r).toLowerCase().includes(q.toLowerCase()));document.querySelector("#records").innerHTML=rs.length?rs.map(r=>`<div class="card"><div class="tag">${E(r.type)} · ${E(r.updated.slice(0,10))}</div><h3>${E(Object.values(r.values)[0]||"제목 없음")}</h3><details><summary>전체 기록 보기</summary>${Object.entries(r.values).map(([k,v])=>v?`<p><b>${E(k)}</b><br>${E(v).replace(/\n/g,"<br>")}</p>`:"").join("")}</details><div class="actions"><button data-edit="${E(r.id)}">수정</button><button data-review="${E(r.id)}" class="primary">AI 검토용 복사</button><button data-delete="${E(r.id)}" class="danger">삭제</button></div></div>`).join(""):`<div class="card">아직 기록이 없습니다. 분석·기획에서 시작하세요.</div>`;document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{let r=S.records.find(x=>x.id===b.dataset.edit);selected=r.type;editing=r.id;open("분석·기획")});document.querySelectorAll("[data-review]").forEach(b=>b.onclick=()=>copyReview(S.records.find(x=>x.id===b.dataset.review)));document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{if(confirm("이 기록을 삭제할까요?")){S.records=S.records.filter(x=>x.id!==b.dataset.delete);save();draw(q)}})}document.querySelector("#recordSearch").oninput=e=>draw(e.target.value);draw()}
function check(){let a=S.checks[checkScope]||{};view.innerHTML=`<h2>제작 검수 체크리스트</h2><label for="scope">프로젝트명 (프로젝트마다 별도 저장)</label><input id="scope" value="${E(checkScope)}"><button id="scopeBtn">프로젝트 적용</button><div class="card"><p><b>${Object.values(a).filter(x=>x==="통과").length}/${D.checks.length} 통과</b></p>${D.checks.map(([c,t],i)=>`<div class="record"><div class="tag">${E(c)}</div><p>${E(t)}</p><select data-check="${i}">${["미확인","통과","수정필요","해당없음"].map(x=>`<option ${a[i]===x?"selected":""}>${x}</option>`).join("")}</select></div>`).join("")}</div>`;document.querySelector("#scopeBtn").onclick=()=>{checkScope=document.querySelector("#scope").value.trim()||"기본 프로젝트";check()};document.querySelectorAll("[data-check]").forEach(s=>s.onchange=()=>{S.checks[checkScope]??={};S.checks[checkScope][s.dataset.check]=s.value;save();check()})}
function coach(){view.innerHTML=`<h2>AI 1:1 감독 코칭</h2><div class="card"><h3>검토 절차</h3><p>① 분석 기록을 작성 → ② AI 검토용 복사 → ③ ChatGPT에 붙여넣기 → ④ 답변을 AI 피드백 기록에 저장 → ⑤ 개선 실습 후 재평가.</p><p class="muted">사이트 자체가 AI API를 호출하지 않습니다. ChatGPT에 원본 이미지/클립 또는 타임코드를 같이 제공하면 검토의 정확도를 높일 수 있습니다.</p><div class="actions"><button id="copyPrompt">코칭 지침 복사</button><a class="btn primary" href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT 열기</a><button id="feedback">피드백 기록 작성</button></div></div><div class="card"><h3>교육용 100점 루브릭</h3>${D.rubric.map(([a,b,c])=>`<div class="record"><b>${E(a)} · ${b}점</b><p class="muted">${E(c)}</p></div>`).join("")}<small>적용 불가 항목 제외 후 비례 환산. 실제 업계 순위를 뜻하지 않음.</small></div><div class="card"><h3>4막 · 15비트 참고</h3><p>설정과 진입 → 시도와 적응 → 압박과 위기 → 결단과 해결. 비트는 장면 수가 아니라 기능.</p>${D.beats.map((b,i)=>`<p>${i+1}. ${E(b)}</p>`).join("")}</div>`;document.querySelector("#copyPrompt").onclick=()=>copy(D.prompt);document.querySelector("#feedback").onclick=()=>{selected="AI 피드백";editing=null;open("분석·기획")}}
async function copy(t){try{await navigator.clipboard.writeText(t);notify("복사 완료 · ChatGPT에 붙여넣으세요")}catch(e){const el=document.createElement("textarea");el.value=t;el.style.position="fixed";el.style.top="10px";el.style.left="10px";el.style.zIndex=20;document.body.append(el);el.select();try{if(!document.execCommand("copy"))throw Error();el.remove();notify("복사 완료")}catch(e){el.style.width="90vw";el.style.height="70vh";el.onclick=()=>el.select();notify("복사가 제한되었습니다. 표시된 내용을 직접 선택·복사하고 새로고침하세요.")}}}
function copyReview(r){copy(D.prompt+"\n\n[기록 유형] "+r.type+"\n"+Object.entries(r.values).map(([k,v])=>k+": "+v).join("\n"))}
function backup(){view.innerHTML=`<h2>백업 및 복원</h2><div class="card"><p>현재 브라우저의 학습 완료, 메모, 기록, 체크리스트를 JSON으로 저장합니다. 다른 기기에서 파일을 가져오면 데이터가 복원됩니다.</p><p class="danger">복원은 현재 브라우저 데이터를 교체합니다. 먼저 백업하세요. 브라우저 데이터 삭제 시 기록도 사라질 수 있습니다.</p><div class="actions"><button class="primary" id="export">JSON 백업 내려받기</button><button id="csv">분석 기록 CSV 내려받기</button></div><label for="imp">JSON 파일 복원</label><input type="file" id="imp" accept=".json,application/json"></div>`;const dl=(name,content,type)=>{const u=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};document.querySelector("#export").onclick=()=>dl("DirectorsLab-"+now()+".json",JSON.stringify({version:1,state:S},null,2),"application/json");document.querySelector("#csv").onclick=()=>{const safe=v=>{let t=String(v??"");if(/^[=+\-@\t\r]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'};let rows=[["유형","ID","갱신일","항목","값"],...S.records.flatMap(r=>Object.entries(r.values).map(([k,v])=>[r.type,r.id,r.updated,k,v]))];dl("DirectorsLab-records.csv","\ufeff"+rows.map(r=>r.map(safe).join(",")).join("\n"),"text/csv;charset=utf-8")};document.querySelector("#imp").onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());const s=obj.state;if(obj.version!==1||!s||!Array.isArray(s.records)||!s.done||!s.notes||!s.checks||!s.records.every(r=>typeof r.id==="string"&&typeof r.type==="string"&&D.fields[r.type]&&typeof r.values==="object"&&typeof r.updated==="string"))throw Error("Invalid backup");if(confirm("현재 기록을 백업 파일로 교체할까요?")){S={done:{},notes:{},records:[],checks:{},drafts:{},...s};save();notify("복원 완료");render()}}catch(e){notify("복원 실패: 올바른 Directors Lab JSON인지 확인하세요.")}}}

async function extract22(v,src){if(!imgSafe(src))return;let im=new Image();im.src=src;await im.decode();let c=document.createElement('canvas');c.width=96;c.height=96;let ctx=c.getContext('2d');ctx.drawImage(im,0,0,96,96);let data=ctx.getImageData(0,0,96,96).data;let buckets=new Map();for(let i=0;i<data.length;i+=4){let r=data[i],g=data[i+1],b=data[i+2],key=[r>>4,g>>4,b>>4].join(',');let a=buckets.get(key)||[0,0,0,0];a[0]++;a[1]+=r;a[2]+=g;a[3]+=b;buckets.set(key,a)}let colors=[];for(let a of [...buckets.values()].sort((a,b)=>b[0]-a[0])){let rgb=a.slice(1).map(x=>Math.round(x/a[0]));if(colors.every(c=>Math.hypot(...c.map((x,i)=>x-rgb[i]))>45))colors.push(rgb);if(colors.length===5)break}let old=v.palette;v.palette=colors.map((c,i)=>({label:['대표색 1','대표색 2','대표색 3','대표색 4','대표색 5'][i],color:'#'+c.map(x=>x.toString(16).padStart(2,'0')).join('')}));if(v22Persist(()=>v.palette=old))notify('대표색 추출 완료. 역할과 색상은 직접 조정하세요.');}

function quizLab24(){let a=academyState24();if(!quizRun24)quizRun24={area:'전체',ids:[],answers:{},finished:false};let q=quizRun24;view.innerHTML=v22Header('MASTERCLASS / A·B QUIZ','연출 비교 퀴즈','정답이 명확한 개념 비교를 연습합니다. 주관적인 연출의 우열은 정답으로 단정하지 않습니다.')+`<div class="card"><div class="v2row"><select id="qArea24">${['전체',...new Set(Q24.map(x=>x[0]))].map(x=>option(x,q.area)).join('')}</select><button class="primary" id="qStart24">새 퀴즈 시작 (최대 10문항)</button><span class="muted">문제은행 ${Q24.length}문항</span></div><div id="quizContent24"></div></div><div class="card"><h3>학습 이력</h3>${a.attempts.slice(-12).reverse().map(r=>`<div class="next-item">${E(r.date)} · ${E(r.area)} <b>${r.correct}/${r.total} (${Math.round(r.correct/r.total*100)}%)</b></div>`).join('')||'<p class="muted">완료한 퀴즈 없음</p>'}</div>`;function draw(){let el=$v('quizContent24');if(!q.ids.length){el.innerHTML='<p>분야를 선택해 시작하세요.</p>';return}el.innerHTML=q.ids.map((id,j)=>{let t=Q24[id];return `<div class="question24"><small>Q${j+1} · ${E(t[0])}</small><h3>${E(t[1])}</h3>${t[5]!==undefined&&q.finished?`<div class="compare24">${[t[5],t[6]].map(k=>`<div>${diagram(TERMS[k])}<small>${E(TERMS[k][1])}</small></div>`).join('')}</div>`:''}<div class="qopts24">${t[2].map((o,k)=>`<button data-q24="${id}" data-opt24="${k}" ${q.finished?'disabled':''} class="${q.finished?(k===t[3]?'right24':q.answers[id]===k?'wrong24':''):q.answers[id]===k?'selected24':''}">${E(o)}</button>`).join('')}</div>${q.finished?`<p class="fact24">${E(t[4])}</p>`:''}</div>`}).join('')+`<div class="v2row"><button class="primary" id="qFinish24" ${q.finished?'disabled':''}>채점 및 해설 보기</button><span>${Object.keys(q.answers).length}/${q.ids.length} 응답</span>${q.finished?`<b>정답 ${q.ids.filter(id=>q.answers[id]===Q24[id][3]).length}/${q.ids.length}</b>`:''}</div>`;el.querySelectorAll('[data-q24]').forEach(b=>b.onclick=()=>{q.answers[b.dataset.q24]=+b.dataset.opt24;draw()});$v('qFinish24').onclick=()=>{if(q.finished)return;if(Object.keys(q.answers).length!==q.ids.length){notify('모든 문항을 선택하세요.');return}q.finished=true;a.attempts.push({date:now(),area:q.area,correct:q.ids.filter(id=>q.answers[id]===Q24[id][3]).length,total:q.ids.length,answers:q.ids.map(id=>({id,selected:q.answers[id],correct:Q24[id][3]}))});save();quizLab24()}};$v('qStart24').onclick=()=>{if(q.ids.length&&!q.finished&&!confirm('진행 중 퀴즈를 새로 시작할까요?'))return;let area=$v('qArea24').value,ids=Q24.map((_,i)=>i).filter(i=>area==='전체'||Q24[i][0]===area);for(let i=ids.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}quizRun24={area,ids:ids.slice(0,10),answers:{},finished:false};quizLab24()};draw()}

function assessment24(){let a=academyState24();view.innerHTML=v22Header('MASTERCLASS / PRACTICE','실습 평가','자가평가와 AI 검토를 구분해 기록합니다. 0~100점은 훈련 루브릭이지 업계 순위가 아닙니다.')+`<div class="card"><h3>실습 제출 및 평가</h3><div class="fieldgrid"><div><label>실습 제목</label><input id="asTitle24" placeholder="예: 같은 인물 측광 A/B"></div><div><label>분야</label><select id="asArea24">${[...new Set(D.lessons.map(x=>x.area))].map(x=>option(x,'')).join('')}</select></div><div class="wide"><label>관찰·실험 조건·결과·근거 링크</label><textarea id="asEvidence24" placeholder="카메라 위치 고정, 빛의 방향만 변경. 두 영상에서 그림자 차이 관찰"></textarea></div><div class="wide"><label>개선할 점 / 다음 실습</label><textarea id="asNext24"></textarea></div></div>${RUB24.map(([n,w,d],i)=>`<label>${n} · ${w}점</label><small>${d}</small><select data-rub24="${i}"><option value="">미평가</option>${[0,5,10,15,20].map(n=>`<option value="${n}">${n}점</option>`).join('')}</select>`).join('')}<p id="asTotal24">미평가</p><div class="actions"><button id="asSave24" class="primary">자가평가 저장</button><button id="asAI24">AI 평가 요청문 복사</button></div></div><div class="card"><h3>평가 이력</h3>${a.practices.slice().reverse().map(r=>`<div class="case24"><b>${E(r.title)}</b><p>${E(r.date)} · ${E(r.area)} · 자가평가 ${r.total===null?'미평가':r.total+'점'} · AI ${r.aiScore===null||r.aiScore===undefined?'미기록':E(r.aiScore)+'점'}</p><p>${E(r.evidence)}</p><p class="muted">다음: ${E(r.next)}</p><label>AI 평가 점수 (선택) / 피드백</label><div class="v2row"><input type="number" min="0" max="100" data-ai24="${E(r.id)}" value="${E(r.aiScore??'')}" placeholder="미기록"><button data-delpractice24="${E(r.id)}">삭제</button></div><textarea data-feedback24="${E(r.id)}" placeholder="AI 답변을 붙여넣으세요">${E(r.feedback||'')}</textarea></div>`).join('')||'<p>기록 없음</p>'}</div>`;let scores=()=>[...view.querySelectorAll('[data-rub24]')].map(x=>x.value===''?null:+x.value),total=()=>scores().every(x=>x!==null)?scores().reduce((s,x)=>s+x,0):null;view.querySelectorAll('[data-rub24]').forEach(x=>x.onchange=()=>{$v('asTotal24').textContent=total()===nul
